# YOLO11n P3-P5; CBAM/FEM positions follow uploaded single-module YAMLs.
# BiFPN topology follows the uploaded yolo11-bifpn.yaml, including P2->P3.
# Fusion uses the same top-level mode reference as the working BiFPN-only YAML.
nc: 5
fusion_mode: bifpn  # Fusion parser resolves this top-level key
scale: n
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, PSConv, [64, 3, 2]] # 0 P1/2
  - [-1, 1, PSConv, [128, 3, 2]] # 1 P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2 P2
  - [-1, 1, CBAM, [7]] # 3 P2 CBAM, as in cbam_only.yaml
  - [-1, 1, PSConv, [256, 3, 2]] # 4 P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 5 P3
  - [-1, 1, CBAM, [7]] # 6 P3 CBAM, as in cbam_only.yaml
  - [-1, 1, PSConv, [512, 3, 2]] # 7 P4/16
  - [-1, 2, C3k2, [512, True]] # 8 P4
  - [-1, 1, PSConv, [1024, 3, 2]] # 9 P5/32
  - [-1, 2, C3k2, [1024, True]] # 10 P5
  - [-1, 1, SPPF, [1024, 5]] # 11
  - [-1, 2, C2PSA, [1024]] # 12

head:
  - [6, 1, FEM, [128]] # 13 FEM P3 before fusion
  - [8, 1, FEM, [128]] # 14 FEM P4 before fusion
  - [12, 1, FEM, [256]] # 15 FEM P5 before fusion

  # Lateral projections: all are 64 channels at n scale.
  - [13, 1, Conv, [256, 1, 1]] # 16 P3/8
  - [14, 1, Conv, [256, 1, 1]] # 17 P4/16
  - [15, 1, Conv, [256, 1, 1]] # 18 P5/32
  - [18, 1, nn.Upsample, [None, 2, nearest]] # 19
  - [[19, 17], 1, Fusion, [fusion_mode]] # 20 weighted P4
  - [-1, 3, C3k2, [256, False]] # 21 P4 top-down
  - [-1, 1, nn.Upsample, [None, 2, nearest]] # 22
  - [[22, 16], 1, Fusion, [fusion_mode]] # 23 weighted P3
  - [-1, 3, C3k2, [256, False]] # 24 P3 top-down
  - [3, 1, Conv, [256, 3, 2]] # 25 enhanced P2 -> P3 bridge
  - [[25, 16, 24], 1, Fusion, [fusion_mode]] # 26 weighted P3
  - [-1, 3, C3k2, [256, False]] # 27 P3 detect
  - [-1, 1, PSConv, [256, 3, 2]] # 28 P3 -> P4
  - [[28, 17, 21], 1, Fusion, [fusion_mode]] # 29 weighted P4
  - [-1, 3, C3k2, [256, False]] # 30 P4 detect
  - [-1, 1, PSConv, [256, 3, 2]] # 31 P4 -> P5
  - [[31, 18], 1, Fusion, [fusion_mode]] # 32 weighted P5
  - [-1, 3, C3k2, [256, False]] # 33 P5 detect
  - [[27, 30, 33], 1, Detect, [nc]] # 34 P3, P4, P5
